<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Drawing</title>
    <link rel="icon" href="draw icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: grey; text-align: center;">
    <button style="font-size: 40px; background-color: lightblue; margin-bottom: 10px" onclick="newPage()">Saved Drawings</button>
    <div id="savedDrawings" style="overflow: auto; width: 500px; height: 500px; margin: auto; background-color: white" hidden>
        <button style="font-size: 40px; background-color: lightblue;" onclick="newPage(`canvas`)">Back</button><br>
    </div><br>
    <canvas id="canvas" width="500" height="500" style="background-color: white;"></canvas><br>
    <button style="font-size: 40px; background-color: lightblue;" onclick="saveDrawing()">Save</button>
    <button style="font-size: 40px; background-color: lightblue;" onclick="ctx.clearRect(0, 0, canvas.width, canvas.height); currentStrokeIndex++; addStroke()">Clear</button>
    <input id="thicknessSlider" type="range" min="1" max="20" value="5" class="slider" style="accent-color: black;">
    <button style="font-size: 40px; background-color: lightblue;" onclick="undo()">Undo</button>
    <button style="font-size: 40px; background-color: lightblue;" onclick="redo()">Redo</button><br><br>
    <div id="colors" style="overflow: auto; white-space: nowrap; width: 50%; margin: auto; background-color: white">
        <div style="background-color: red; border-radius: 50%; margin: auto; width: 50px; height: 50px; display: inline-block; margin-left: 5px; margin-top: 5px; margin-right: 15px;"></div>
        <div style="background-color: orange; border-radius: 50%; margin: auto; width: 50px; height: 50px; display: inline-block; margin-right: 15px;"></div>
        <div style="background-color: yellow; border-radius: 50%; margin: auto; width: 50px; height: 50px; display: inline-block; margin-right: 15px;"></div>
        <div style="background-color: green; border-radius: 50%; margin: auto; width: 50px; height: 50px; display: inline-block; margin-right: 15px;"></div>
        <div style="background-color: blue; border-radius: 50%; margin: auto; width: 50px; height: 50px; display: inline-block; margin-right: 15px;"></div>
        <div style="background-color: purple; border-radius: 50%; margin: auto; width: 50px; height: 50px; display: inline-block; margin-right: 15px;"></div>
        <div style="background-color: pink; border-radius: 50%; margin: auto; width: 50px; height: 50px; display: inline-block; margin-right: 15px;"></div>
        <div style="background-color: black; border-radius: 50%; margin: auto; width: 50px; height: 50px; display: inline-block; margin-right: 15px; border: 4px solid red"></div>
        <div style="background-color: dimgray; border-radius: 50%; margin: auto; width: 50px; height: 50px; display: inline-block; margin-right: 15px;"></div>
        <div style="background-color: #6F4E37; border-radius: 50%; margin: auto; width: 50px; height: 50px; display: inline-block; margin-right: 15px;"></div>
        <img src="eraser.png" style="background-color: white; border-radius: 25%; margin: auto; width: 50px; height: 50px; display: inline-block; margin-right: 5px;">
    </div>
</body>
<script src="script.js"></script>
</html>
