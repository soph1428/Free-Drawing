<!DOCTYPE html>
<html lang="en" style="scrollbar-gutter: stable">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Drawing</title>
    <link rel="icon" href="draw icon.png">
</head>
<body style="background-color: grey; text-align: center;">
    <button id="savedDrawingsBtn" style="font-size: 40px; background-color: lightblue; margin-bottom: 15px;" onclick="newPage()">Saved Drawings</button>
    <div id="savedDrawings" style="overflow: auto; width: 500px; height: 500px; margin: auto; background-color: white" hidden>
        <button id="backToDrawing" style="font-size: 40px; background-color: lightblue;" onclick="newPage(`canvas`)">Back</button><br>
    </div>
    <label hidden id="drawingText" style="font-size: 40px; background-color: lightblue;"></label><br>
    <canvas id="canvas" width="500" height="500" style="background-color: white; margin-top: 5px;"></canvas><br>
    <button id="saveBtn" style="font-size: 40px; background-color: lightblue;" onclick="saveDrawing()">Save</button>
    <button id="clearCanvas" style="font-size: 40px; background-color: lightblue;" onclick="ctx.clearRect(0, 0, canvas.width, canvas.height); currentStrokeIndex++; addStroke()">Clear</button>
    <input id="thicknessSlider" type="range" min="1" max="20" value="5" class="slider" style="accent-color: rgb(0, 0, 0);">
    <button style="font-size: 40px; background-color: lightblue;" onclick="undo()">Undo</button>
    <button style="font-size: 40px; background-color: lightblue;" onclick="redo()">Redo</button><br><br>
    <label style="font-size: 40px; background-color: lightblue; margin-right: 5px;">Pick a color:</label>
    <input style="visibility: hidden; position: absolute; transform: translateY(-2px);" id="realPickColor" type="color">
    <div style="display: inline-block; vertical-align: top; background-color: white; height: 47px;">
        <span id="pickColor" style="background-color: rgb(0, 0, 0); border-radius: 50%; width: 47px; height: 47px; display: inline-block"></span>
    </div>
    <button style="font-size: 37px; background-color: lightblue; margin-left: 4px;" onclick="saveColor()">Save color</button>
    <img id="eraserButton" src="eraser.png" onclick="selectSavedColor(this)" style="background-color: white; vertical-align: top; border: 4px solid white; border-radius: 25%; width: 40px; height: 40px;">
    <div id="savedColors" style="overflow: auto; white-space: nowrap; width: fit-content; max-width: 50%; margin: auto; margin-top: 10px; background-color: white">
    </div>
    <button style="font-size: 37px; margin-top: 10px; background-color: lightblue;" onclick="deleteColor()">Delete color</button>
    <button style="font-size: 37px; margin-top: 10px; background-color: lightblue;" onclick="newPage(`canvas`); clearCanvas.click()">New drawing</button>
</body>
<script src="script.js"></script>
</html>
